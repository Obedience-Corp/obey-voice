<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#05060a" />
  <title>Stage</title>
  <style>
    :root {
      color-scheme: dark;
      --fg: #f4f6ff;
      --muted: rgba(244, 246, 255, 0.55);
      --glass: rgba(8, 10, 18, 0.55);
      --line: rgba(255, 255, 255, 0.12);
      --accent: #7aa2f7;
      --danger: #f7768e;
      --ok: #9ece6a;
      font-family: "Noto Sans", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: #05060a;
      color: var(--fg);
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #fx { pointer-events: none; }
    #hud, #sheet {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(1.2rem, env(safe-area-inset-bottom));
      text-align: center;
      font-size: clamp(0.85rem, 2.4vw, 1.15rem);
      letter-spacing: 0.04em;
      color: var(--muted);
      text-transform: uppercase;
      transition: opacity 0.4s ease;
      padding: 0 1rem;
    }
    .hint.gone { opacity: 0; }
    .caption, .state-pill { display: none; }
    .gear {
      position: absolute;
      top: max(0.7rem, env(safe-area-inset-top));
      right: max(0.7rem, env(safe-area-inset-right));
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--glass);
      pointer-events: auto;
      color: var(--fg);
      font-size: 1.2rem;
      display: grid;
      place-items: center;
    }
    #sheet {
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
    }
    #sheet.open {
      display: flex;
      pointer-events: auto;
    }
    .panel {
      width: min(36rem, 100%);
      background: #0c0f18;
      border: 1px solid var(--line);
      border-radius: 1.4rem 1.4rem 0 0;
      padding: 1.2rem 1.2rem max(1.4rem, env(safe-area-inset-bottom));
    }
    .panel h2 { margin: 0 0 0.35rem; font-size: 1.15rem; }
    .panel p { margin: 0 0 1rem; color: var(--muted); font-size: 0.92rem; }
    .panel label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0.6rem 0 0.3rem;
    }
    .panel input {
      width: 100%;
      border: 1px solid var(--line);
      background: #161a26;
      color: var(--fg);
      border-radius: 0.8rem;
      padding: 0.85rem 0.9rem;
      font: inherit;
      font-size: 1.05rem;
    }
    .row { display: flex; gap: 0.55rem; margin-top: 0.85rem; flex-wrap: wrap; }
    .row button {
      flex: 1;
      min-height: 48px;
      border: 0;
      border-radius: 0.85rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .row .primary { background: var(--accent); color: #081018; }
    .row .ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
    .gestures {
      margin: 0.8rem 0 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }
    .live { color: var(--ok) !important; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div id="hud">
    <div class="state-pill" id="pill">idle · demo</div>
    <button class="gear" id="gear" type="button" aria-label="Connect">⚙</button>
    <div class="caption" id="caption"><span class="who" id="who"></span><span id="line"></span></div>
    <div class="hint" id="hint">tap once, then just talk</div>
  </div>
  <div id="sheet">
    <div class="panel">
      <h2>Stage</h2>
      <p>Camera face for Obey Voice. Works as a demo, or pair it to a live serve.</p>
      <label for="pairCode">Pairing code</label>
      <input id="pairCode" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" />
      <label for="token">Bearer token</label>
      <input id="token" type="password" autocomplete="off" placeholder="filled by pair, or paste" />
      <div class="row">
        <button class="ghost" id="pair" type="button">Pair</button>
        <button class="primary" id="connect" type="button">Go live</button>
      </div>
      <div class="row">
        <button class="ghost" id="demo" type="button">Stay in demo</button>
      </div>
      <ul class="gestures">
        <li>Just talk — the mic stays open</li>
        <li>Tap to interrupt</li>
        <li>Swipe left / right — orb, radial, wave</li>
        <li>Double-tap — fullscreen</li>
      </ul>
    </div>
  </div>
  <script src="stage.js"></script>
</body>
</html>
