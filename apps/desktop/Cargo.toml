[package]
name = "obey-voice-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native desktop interface for Obey Voice"
license = "Apache-2.0"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "persistence", "default_fonts", "wgpu", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2.2"
dbus = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "=0.25.0", default-features = false }
raw-window-handle = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder", "NSVisualEffectView", "NSAppearance", "NSGraphics"] }
