name: work-stream-gate
description: WI-3ecd75 G0 — a local worker's tool calls reach the bus with job attribution and kinds, the job is queued then started, and status speaks while it runs
duration: 6m
input: text
router_tools: route_only
tts: { provider: kokoro, voice: af_heart }
capture: { audio: true, speakers: false }

turns:
  - id: spawn
    user: "create a file called README.md with one line about this folder, then list the files here and read the README back"
    wait: job_started
    timeout: 90s
    expect:
      - { event: job_queued }
      - { event: job_started }
      - { route_kind: spawn }
      - { spoken_matches: "(?i)working on it" }
      - { no_event: tool_call_started }

  # "So far: …" is spoken only once the worker has closed a fold row; a small
  # model often thinks for longer than this turn lasts, so the fold's spoken
  # half is covered by pipeline tests and the events here, not asserted.
  - id: status
    user: "what's happening"
    wait: idle
    timeout: 45s
    expect:
      - { route_kind: job.status }
      - { spoken_matches: "(?i)still working on|queued|no job is running" }

  - id: drain
    user: ""
    wait: job_terminal
    timeout: 4m

expect:
  - { metric: job_started, op: "==", value: 1 }
  - { metric: job_finished, op: "==", value: 1 }
  - { metric: worker_tool_calls, op: ">=", value: 2 }
  - { metric: live_tool_calls, op: "==", value: 0 }
  - { metric: crackle_failing_wavs, op: "==", value: 0 }
