name: work-stream-cancel
description: WI-9bc269 D9 — "kill it" ends a running worker job with reason cancelled, and "Stopped after …" is spoken exactly once
duration: 4m
input: text
router_tools: route_only
tts: { provider: kokoro, voice: af_heart }
capture: { audio: true, speakers: false }

turns:
  - id: spawn
    user: "create a file called story.md with a ten paragraph story about a lighthouse keeper, then read it back and count the words"
    wait: job_started
    timeout: 90s
    expect:
      - { event: job_queued }
      - { event: job_started }
      - { route_kind: spawn }
      - { no_event: job_terminal }

  - id: cancel
    user: "kill it"
    wait: idle
    timeout: 45s
    expect:
      - { route_kind: job.abort }
      - { event: job_terminal }
      - { spoken_matches: "(?i)\\bstopped\\b" }
      - { spoken_not_matches: "(?i)budget|dropped" }

expect:
  - { metric: job_started, op: "==", value: 1 }
  - { metric: job_aborted, op: "==", value: 1 }
  - { metric: job_finished, op: "==", value: 0 }
  - { metric: crackle_failing_wavs, op: "==", value: 0 }
