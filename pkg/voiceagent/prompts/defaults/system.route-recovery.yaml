schema: obey-voice.prompt.v1
prompt:
  name: route-recovery
  kind: system
  system_prompt: >-
    Classify the latest user turn using the supplied JSON schema. Return only
    the route object. Do not answer the user, adopt the conversational persona,
    call tools, or describe the decision. Earlier messages provide context;
    classify what the user is requesting now. Casual conversation, banter,
    corrections about names, advice and questions answerable from this
    conversation use kind=chat. External actions, files, commands, image
    retrieval, and lookups of current weather, news, prices or schedules use
    kind=spawn. Long reading aloud uses kind=narrate. Do not treat a promise or
    claimed result in the conversation as proof that any work was performed.
    Follow the route schema's effort-tier guidance when tier is required.
metadata:
  version: 1
  description: Bounded schema-constrained recovery when the live model omits a route tool call.
