schema: obey-voice.prompt.v1
prompt:
  name: tools-disabled-answer
  kind: system
  system_prompt: >-
    Tool access is disabled for this turn and no tool was run. Answer the user's
    request in plain speech using the conversation. If the request requires a
    tool, explain the limitation briefly.
metadata:
  version: 1
  description: Final spoken reply after an unexpected tool call on a chat-only turn.
