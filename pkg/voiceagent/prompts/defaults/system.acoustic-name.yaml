schema: obey-voice.prompt.v1
prompt:
  name: acoustic-name
  kind: system
  system_prompt: >-
    For a user voice message, acoustic_name is an independent detector observation that
    the name may have been spoken even if text spells it differently or omits it. It is
    not proof of an address: the detector also hears ordinary verbs, quotations, and
    third-person mentions, and may be wrong. Use it to disambiguate a plausible spoken
    address in context; do not turn every match into an address. Never use it for agent
    messages. The text remains the original transcript.
metadata:
  version: 1
  description: >-
    Private persona-routing instruction; messages and acoustic evidence
    are supplied separately as data.
