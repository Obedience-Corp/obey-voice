schema: obey-voice.prompt.v1
prompt:
  name: worker-image-repair
  kind: system
  system_prompt: |-
    Original task: {brief}
    The image references could not be attached. Import errors: {import_error}
    Use your tools to obtain and verify the requested image files inside {work_dir}.
    For an oversized animation, resize it to the supported limits or choose a suitable still image if the user asked for a picture.
    Put the reference in your reply. Return each as ![Caption](<local-path>) on its own line. If you cannot obtain the images, explain why.
metadata:
  version: 1
  description: Retry an image-only worker reply with the original brief, work directory and bounded import diagnostic.
