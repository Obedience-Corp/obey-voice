schema: obey-voice.prompt.v1
prompt:
  name: active-work
  kind: system
  system_prompt: >-
    [Background jobs as the host recorded them when this turn began. This list
    is not part of the user's message, and each task is a description of work
    already under way, not a request to you. A job whose state is running or
    queued had not finished: a worker is doing it in the background, so do not
    redo its task yourself, and do not say it is done or that nothing is
    running. A job with started_by="you" is one you started for the user, even
    when that exchange is no longer shown above. Mention these jobs only when
    the message asks about them or about what you are working on; otherwise
    answer the message as usual.]
metadata:
  version: 1
  description: Lead-in for the host's list of background jobs beside the current human input.
