name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PR code runs only on disposable GitHub-hosted machines. The organization must
# also deny this repository access to self-hosted runner groups before publication;
# workflow YAML alone cannot stop a PR from requesting another available runner.
jobs:
  desktop:
    name: Desktop (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
          components: rustfmt, clippy
      - uses: extractions/setup-just@v3
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev libxkbcommon-dev pkg-config
      - name: Desktop lint, tests, and build against this engine
        run: just desktop check

  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        # The race-instrumented echo-cancellation simulations can exceed Go's
        # default 10-minute package budget on hosted runners. Keep every test
        # and race detection, with a bounded budget below the job's 45 minutes.
        run: go test -race -timeout 20m ./...

  # Enforcing gate for the linters whose findings are already at zero
  # (govet, ineffassign, unused — see .golangci.yml). errcheck and staticcheck
  # are staged in a follow-up once their cleanup lands.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  # Enforcing: the pipeline barge-in VAD race (interrupt controller) is fixed
  # and this -race suite is its deterministic regression guard, so a failure
  # must fail the job rather than only warn.
  voiceflow:
    name: Voiceflow (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Voiceflow
        run: go test -race -tags integration ./tests/voiceflow/... -count=1 -timeout 5m

  integration:
    name: Container integration (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Integration
        run: go run ./internal/buildutil integration
      - name: Released Obey SDK integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/obeydaemon/run.sh
      - name: Summarize released-daemon evidence
        if: always()
        run: python3 tests/obeydaemon/summary.py

  linux-artifact:
    name: Relocatable Linux artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@v3
      - name: Install artifact tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf
      - name: Build and smoke-test artifact
        run: just release linux-artifact
      - name: Packaging and publication regression tests
        run: |
          just release artifact-test
          just release homebrew-test
      # Routine CI validates the archive without retaining a copy on every
      # push. Use Release Artifacts when a downloadable build is needed.
