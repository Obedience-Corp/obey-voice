name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    name: Native artifact (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
            recipe: linux-artifact
          - runner: macos-15
            platform: macos-arm64
            recipe: macos-artifact
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: extractions/setup-just@v3
      - name: Install Linux artifact tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf
      - name: Install macOS build shell
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Check packaging and publication failure paths
        run: just release artifact-test
      - name: Build and verify relocated native archive
        env:
          ARTIFACT_RECIPE: ${{ matrix.recipe }}
        run: just release "$ARTIFACT_RECIPE"
      - uses: actions/upload-artifact@v4
        with:
          name: obey-voice-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: artifacts
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    # Serialize release mutation across tags as well as retries.
    concurrency:
      group: obey-voice-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: obey-voice-*
          path: dist/release
          merge-multiple: true
      - name: Stage, verify, and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py "$GITHUB_REF_NAME"
